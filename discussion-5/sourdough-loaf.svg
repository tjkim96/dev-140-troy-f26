<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f4efe6"/>
  <!-- cutting board -->
  <rect x="40" y="215" width="320" height="34" rx="10" fill="#b07a45"/>
  <rect x="40" y="215" width="320" height="8" rx="4" fill="#c48f58"/>
  <!-- loaf -->
  <ellipse cx="200" cy="170" rx="125" ry="70" fill="#c9893f"/>
  <ellipse cx="200" cy="160" rx="112" ry="58" fill="#d99b4c"/>
  <!-- cross score -->
  <path d="M135 150 Q200 130 265 150" stroke="#f3dcae" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M200 110 Q190 160 200 210" stroke="#f3dcae" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- flour dusting -->
