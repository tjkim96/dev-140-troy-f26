<!DOCTYPE html>
<!--
  ============================================================
  DEV.140 Homework 1: My First Web Page (Template)
  ============================================================
  This template gives you an OUTLINE. You write the HTML.
  Each comment describes what belongs there and which element
  to consider.

  YOUR PAGE MUST HAVE:
  - At least 5 DIFFERENT semantic elements
    (header, nav, main, section, article, figure, footer, p, ul/ol...)
  - Exactly ONE <h1>, <h2> for sections, <h3> for subsections.
    Never skip a level, and never pick a heading for its size.
  - At least one <img> with DESCRIPTIVE alt text
  - At least one <ul> or <ol> used for real list content
  - A descriptive <title>
  No CSS this week. Structure and meaning only.
  ============================================================
-->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- TODO: Add a <title> that describes YOUR page.
         "Document" or "Home" is not descriptive. -->
    <title>Example Webpage</title>
</head>

<body>
    <!-- ===== PAGE HEADER =====
         Which element holds introductory content for a page?
         Inside it:
         - The page's ONE main heading (your name or topic)
         - Optional: a short tagline paragraph
         - A navigation menu: which element wraps navigation links?
           Hint: a list of links works well here. Use href="#some-id"
           to jump to a section that has id="some-id". -->
    <header>
        <h1>John Doe</h1>
        <p>Welcome to my webpage!</p>
        <nav>
            <ul>
                <li><a href="#introduction">Introduction</a></li>
                <li><a href="#interests">Interests</a></li>
                <li><a href="#goals">Goals</a></li>
            </ul>
        </nav>
    </header>


    <!-- ===== MAIN CONTENT =====
         Which element wraps the main, unique content of the page?
         Put ALL of the sections below inside it. -->

    <!-- SECTION 1: Introduction
           - A section heading (which level comes right after h1?)
           - An image of you or your topic. Put the file in the images
             folder. A placeholder is there if you need one:
             sourdough-loaf.svg
             Write alt text that describes what's in the image.
             Bonus: wrap the image in <figure> with a <figcaption>.
           - A paragraph or two introducing yourself or your topic -->
    <figure>
        <img src="sourdough-loaf.svg" alt="A loaf of sourdough bread" />
        <figcaption>A freshly baked sourdough loaf</figcaption>
    </figure>


    <!-- SECTION 2: Something with subtopics
           (interests, highlights, key facts, projects...)
           - A section heading
           - At least two subtopics, each with its own heading
             (one level below the section heading) and a paragraph.
             Is each subtopic self-contained? Consider <article>. -->


    <!-- SECTION 3: A list
           (goals, steps, rankings, favorites, recommendations...)
           - A section heading
           - A list. Does the order matter?
             Yes: use an ordered list.  No: use an unordered list. -->
    <ol>
        <li>Whole wheat</li>
        <li>Ciabatta</li>
        <li>Rye</li>
    </ol>


    <!-- OPTIONAL: Add more sections of your own. -->


    <!-- ===== PAGE FOOTER =====
         Which element holds closing info like copyright or credits?
         Include your name and the year. -->

</body>

</html>
